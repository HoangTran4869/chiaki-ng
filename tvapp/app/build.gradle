plugins { id 'com.android.application' }
android {
    namespace 'vn.dichgame.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.dichgame.tv'
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName '0.1'
    }
    signingConfigs {
        ky {
            storeFile file('ky_thu.jks')
            storePassword 'dichgame'
            keyAlias 'dichgame'
            keyPassword 'dichgame'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ky
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}
