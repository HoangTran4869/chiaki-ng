name: Build cau-noi (macOS arm64)

# Cau noi PS5 Choi tu xa cho ban Mac cua Dich Phu De Game (chip Apple M1 tro len).
# Build tren macos-14 de chay duoc tu macOS 14 tro len. Ket qua day len nhanh ban-build-mac
# (file > 18MB cat thanh .phan_aa, .phan_ab... giong ban Windows).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "caunoi/**"
      - ".github/workflows/build-caunoi-mac.yml"

jobs:
  build-caunoi-mac:
    name: Build cau-noi macOS arm64
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages
          brew update
          brew install ffmpeg opus openssl@3 cmake ninja pkgconf protobuf@29 json-c miniupnpc libevent dylibbundler || true
          brew link --force protobuf@29 || true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCHIAKI_ENABLE_GUI=OFF -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_TESTS=OFF \
            -DCHIAKI_ENABLE_CAUNOI=ON -DCHIAKI_ENABLE_FFMPEG_DECODER=ON \
            -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DCHIAKI_ENABLE_SETSU=OFF \
            -DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF -DCHIAKI_ENABLE_SPEEX=OFF \
            -DCHIAKI_ENABLE_PI_DECODER=OFF \
            -DOPENSSL_ROOT_DIR="$(brew --prefix)/opt/openssl@3" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/protobuf@29"

      - name: Build
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          set +e
          cmake --build build --config Release --target cau-noi 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error|Error|undefined|ld:" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      - name: Package (kem thu vien dylib)
        run: |
          mkdir -p cau-noi-mac/libs
          cp build/caunoi/cau-noi cau-noi-mac/
          dylibbundler -od -b -x cau-noi-mac/cau-noi -d cau-noi-mac/libs -p @executable_path/libs/
          # ky tam (ad-hoc) de macOS cho chay
          for f in cau-noi-mac/libs/*.dylib; do codesign --force --sign - "$f"; done
          codesign --force --sign - cau-noi-mac/cau-noi
          cp COPYING cau-noi-mac/LICENSE-AGPL.txt
          echo "cau-noi (macOS) - dua tren chiaki-ng (https://github.com/streetpea/chiaki-ng), AGPL-3.0." > cau-noi-mac/README.txt
          echo "Ma nguon: https://github.com/HoangTran4869/chiaki-ng (thu muc caunoi)" >> cau-noi-mac/README.txt
          otool -L cau-noi-mac/cau-noi
          du -sh cau-noi-mac cau-noi-mac/libs
          ls -la cau-noi-mac cau-noi-mac/libs

      - name: Smoke test (chay thu, khong can PS5)
        run: |
          cd cau-noi-mac
          ./cau-noi 2>&1 | head -20 || true
          (./cau-noi tim --timeout 2 2>&1 || true) | head -20

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cau-noi-mac
          path: cau-noi-mac
          if-no-files-found: error
          retention-days: 30

      - name: Push to branch ban-build-mac (de Claude lay ve qua git)
        run: |
          mkdir out
          cp -R cau-noi-mac out/
          (cd cau-noi-mac && ls -lR) > out/danh_sach_file.txt
          cd out
          find cau-noi-mac -type f -size +18000k | while read f; do
            split -b 18000000 "$f" "$f.phan_" && rm "$f"
          done
          cd ..
          echo "${{ github.sha }}" > out/commit.txt
          cd out
          git init -q
          git checkout -q -b ban-build-mac
          git add .
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "build mac ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ban-build-mac
